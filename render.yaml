# Render.com へのデプロイ設定(Blueprint)
# 使い方: Render にログイン → New → Blueprint → このリポジトリを選択 → Apply
services:
  - type: web
    name: oshikatsu-os
    runtime: docker
    dockerfilePath: ./web/Dockerfile
    dockerContext: ./web
    plan: starter
    healthCheckPath: /login
    # SQLite データベースの永続化(これがないと再デプロイでデータが消える)
    disk:
      name: oshikatsu-data
      mountPath: /app/data
      sizeGB: 1
